name: CI

on:
  push:
    branches: ["main", "master", "frontend"]
  pull_request:
    branches: ["main", "master", "frontend"]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Secret scanning ---
  # Runs first and independently of everything else: if a credential was
  # accidentally committed, we want that signal even if lint/tests are broken
  # for an unrelated reason, and there's no reason to wait on them for it.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Lint ---
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .

  # --- Dependency vulnerability scan ---
  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Audit training-only dependencies
        run: pip-audit -r requirements-training.txt
        continue-on-error: true  # informational: this stack (torch/transformers/etc) is never deployed

  # --- Tests ---
  # Runs against a real MongoDB service container, matching how test_api.py's
  # module-scoped `client` fixture actually exercises the app's lifespan
  # (real DB connections, nothing mocked) - see docs/15-testing.md.
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: "mongodb://localhost:27017/?authSource=admin"
      MONGODB_DB_NAME: "velar_ci"
      MILVUS_URI: "http://localhost:19530"
      EMBED_MODEL: "nomic-embed-text"
      LLM_MODEL: "llama3"
      VELAR_API_KEY: "ci_test_key"
      JWT_SECRET_KEY: "ci_test_jwt_signing_key_at_least_32_characters_long"
      LOG_LEVEL: "WARNING"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest test_api.py -v

  # --- Frontend (Flutter) ---
  frontend:
    name: Frontend (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run test suite
        run: flutter test

  # --- Docker build + image hardening/vulnerability checks ---
  docker:
    name: Docker build, lint & scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build -t velar-backend:ci .

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: velar-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # informational for now - flip to "1" to hard-fail the build once triaged
          format: "table"
