[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", ".venv-linux", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names)
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs / footguns)
    "S",    # flake8-bandit (security lint: hardcoded secrets, insecure calls)
    "UP",   # pyupgrade (modern Python idioms)
]
ignore = [
    "E501",   # line length is a formatter's job, not a hard lint failure
    "S101",   # assert is fine in test_api.py; don't blanket-ban it
    "UP042",  # (str, Enum) -> StrEnum: not purely cosmetic - StrEnum's __str__/__format__
              # behavior differs subtly and these enums flow through Pydantic
              # serialization and Mongo documents everywhere. Not worth the
              # regression risk for a style preference; revisit deliberately,
              # with full test coverage, if ever desired.
]

[tool.ruff.lint.per-file-ignores]
"test_api.py" = ["S101", "S105", "S106", "S311"]  # asserts, test fixture "keys", and non-crypto random test data
"scripts/*.py" = ["S105", "S106", "S108", "S311"]  # dev/local-only scripts with known local defaults and non-crypto mock data generation

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
