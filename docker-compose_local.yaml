version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  velar-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velar-backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "9850:8000"
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo_data:
