services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  velar-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velar-backend
    working_dir: /app
    # Bind-mounting the repo here is intentional and dev-only: it lets you
    # edit code on the host and see it reflected without rebuilding the
    # image. docker-compose_production.yaml deliberately does NOT do this -
    # production must run exactly what was built into the image.
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "9850:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:
